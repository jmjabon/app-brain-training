<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dual N-Back</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CONSOLA DE DEPURACIÓN VISUAL PARA iOS -->
    <div id="ios-debug-console" style="position: fixed; bottom: 0; left: 0; right: 0; height: 35%; background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace; font-size: 12px; overflow-y: scroll; z-index: 99999; padding: 10px; pointer-events: auto; backdrop-filter: blur(5px);">
        <strong style="color: #fff;">Consola de Depuración Activa:</strong><br>
    </div>

    <script>
        (function() {
            const debugConsole = document.getElementById('ios-debug-console');
            
            function logToScreen(prefix, message, color) {
                const line = document.createElement('div');
                line.style.color = color;
                line.style.borderBottom = '1px solid #333';
                line.style.padding = '4px 0';
                line.style.wordWrap = 'break-word';
                
                // Si el mensaje es un objeto (JSON), lo formatea para poder leerlo
                const parsedMessage = typeof message === 'object' ? JSON.stringify(message) : message;
                line.textContent = `${prefix} ${parsedMessage}`;
                
                debugConsole.appendChild(line);
                debugConsole.scrollTop = debugConsole.scrollHeight; // Auto-scroll hacia abajo
            }

            // 1. Interceptar console.log
            const originalLog = console.log;
            console.log = function(...args) {
                logToScreen('[LOG]', args.join(' '), '#00ff00');
                originalLog.apply(console, args);
            };

            // 2. Interceptar console.error
            const originalError = console.error;
            console.error = function(...args) {
                logToScreen('[ERR]', args.join(' '), '#ff3333');
                originalError.apply(console, args);
            };

            // 3. Capturar Errores Fatales (Archivos no encontrados, fallos de sintaxis)
            window.onerror = function(message, source, lineno, colno, error) {
                const file = source ? source.split('/').pop() : 'Desconocido';
                logToScreen('[FATAL]', `${message} (Archivo: ${file}, Línea: ${lineno})`, '#ff3333');
                return false; 
            };

            // 4. Capturar Promesas Rechazadas (Muy útil para la Web Speech API o Cargas JSON)
            window.addEventListener('unhandledrejection', function(event) {
                logToScreen('[PROMISE]', `Rechazada: ${event.reason}`, '#ff9900');
            });

            console.log('Consola virtual inicializada correctamente.');
        })();
    </script>
    <!-- Pantalla de Configuración -->
    <div id="setup-screen" class="screen active">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='../../index.html'">← Hub</button>
            <h1>Dual N-Back</h1>
        </div>
        
        <div class="card">
            <h2>Configuración</h2>
            <div class="form-group">
                <label>Nivel (N):</label>
                <div class="stepper">
                    <button id="btn-dec-n">-</button>
                    <span id="n-value">2</span>
                    <button id="btn-inc-n">+</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>Progresión:</label>
                <div class="segmented-control">
                    <button class="seg-btn active" data-mode="manual">Manual</button>
                    <button class="seg-btn" data-mode="auto">Automática</button>
                </div>
                <p class="hint">Auto: Sube de nivel si superas el 80% de aciertos.</p>
            </div>
            
            <button id="btn-start" class="primary-btn">Empezar Entrenamiento</button>
        </div>
    </div>

    <!-- Pantalla de Juego -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <span id="game-n-indicator">N = 2</span>
            <span id="game-turn-indicator">Turno 1 / 24</span>
        </div>

        <div class="grid-container">
            <div class="grid" id="grid">
                <!-- Generado por JS -->
                <div class="cell" id="cell-0"></div><div class="cell" id="cell-1"></div><div class="cell" id="cell-2"></div>
                <div class="cell" id="cell-3"></div><div class="cell" id="cell-4"></div><div class="cell" id="cell-5"></div>
                <div class="cell" id="cell-6"></div><div class="cell" id="cell-7"></div><div class="cell" id="cell-8"></div>
            </div>
        </div>

        <div class="controls">
            <button id="btn-pos" class="action-btn">
                <span class="icon">📍</span>
                <span>Posición</span>
            </button>
            <button id="btn-audio" class="action-btn">
                <span class="icon">🔊</span>
                <span>Audio</span>
            </button>
        </div>
    </div>

    <!-- Pantalla de Resultados -->
    <div id="result-screen" class="screen">
        <div class="card">
            <h2>Resultados</h2>
            <div class="stats">
                <div class="stat-box">
                    <span class="stat-label">Posición</span>
                    <span id="score-pos" class="stat-value">0%</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Audio</span>
                    <span id="score-audio" class="stat-value">0%</span>
                </div>
            </div>
            <p id="result-message" class="result-msg"></p>
            
            <button id="btn-play-again" class="primary-btn">Jugar de nuevo</button>
            <button class="secondary-btn" onclick="window.location.href='../../index.html'">Volver al Hub</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
